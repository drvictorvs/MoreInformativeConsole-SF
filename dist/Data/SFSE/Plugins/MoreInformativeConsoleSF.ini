; More Informative Console SF
;
; If OSF Settings is installed, configure the mod in its menu instead: the menu's values replace
; the ones in this file. This file is used when OSF Settings isn't installed.
; Changes here take effect the next time the game starts.

[General]
; Draw the info panel above the console.
bShowPanel = 1
; Also print the same information into the console history each time you click a new reference.
bPrintToConsole = 0
; How often, in frames, the panel re-reads the selection while the console is open.
iRefreshFrames = 15
; Write the raw selection text and panel layout numbers to the log (for troubleshooting).
bDebugLog = 0

[Panel]
; 1 = right edge of the console, 0 = left edge.
bAlignRight = 1
; 1 = cover the console (the panel's bottom lines up with the console's bottom),
; 0 = sit just above the console. Either way the panel stays below the top of the screen.
bOverConsole = 0
; Tallest the panel gets, as a percentage of the screen height. Longer text scrolls.
fMaxHeightPercent = 100
; 1 = the mouse wheel scrolls the panel. The panel then takes mouse input, so clicks on it
; don't select what's behind it.
bScrollWithMouse = 1
; 1 = the keys below scroll the panel by a page while the console is open.
bScrollKeys = 1
; Windows virtual-key codes. 33 (0x21) = PageUp, 34 (0x22) = PageDown.
iScrollUpKey = 33
iScrollDownKey = 34
; Panel width as a percentage of the console width.
fWidthPercent = 40
; Scales the whole panel, text included (0.5 to 2.5 in the menu).
fScale = 1.0
; 0 = same size as the console text.
iFontSize = 0
; Gap, in pixels, between the panel and the edges of the console and the screen.
fMargin = 16
; Extra nudge, in pixels (negative Y moves it up).
fOffsetX = 0
fOffsetY = 0
; Colors: 0xRRGGBB or #RRGGBB.
iBackgroundColor = 0x000000
; 0.0 (transparent) to 1.0 (opaque).
fBackgroundAlpha = 0.65
iLabelColor = 0x9FB4C8
iHeaderColor = 0xF2C14E

[Content]
bShowReference = 1
bShowBase = 1
bShowModel = 1
bShowKeywords = 1
iMaxKeywords = 12
; Race, traits (essential, protected, unique...), level.
bShowNPC = 1
bShowFactions = 1
; 1 = one faction per line (like the Worn items), 0 = all on one line.
bFactionsAsList = 0
; Most factions to show.
iMaxFactions = 12
; Lock level and key for doors and containers.
bShowLock = 1
bShowPosition = 1
; Parent locations, e.g. "Jemison Mercantile > New Atlantis > Jemison".
bShowLocationChain = 1
bShowInventory = 1
iMaxInventoryItems = 8
; AI package, queued idle, furniture, spoken line, follower command, light level.
bShowAI = 1
; Worn items: biped slots each item covers, and (with bShowWornModels) the armor addon
; picked for the actor's race and sex with its model path.
bShowWorn = 1
iMaxWornItems = 16
bShowWornModels = 1

[Experimental]
; These call through the game's function tables, which can't be checked in advance.
; If turning one on crashes the game, turn it off and report it.
bShowActorState = 0
; Material swaps (layered material swap forms and their material -> override pairs) for the
; base object's model and each worn addon. Calls the game's swap lookup.
bShowMaterialSwaps = 0
iMaxSwapEntries = 6
bShowActorValues = 0
; 1 = one actor value per line. Values show as current, then (base N) when the base differs.
bActorValuesAsList = 0
; Which actor values to show.
bAVHealth = 1
bAVOxygen = 1
bAVCarry = 1
bAVSpeed = 1
bAVAggression = 1
bAVConfidence = 1
bAVAssistance = 1
bAVMorality = 1
; Hide spacesuit in settlements / hide helmet where the air is breathable (the game's cosmetic toggles).
bAVHideSpacesuit = 1
bAVHideHelmet = 1
; More actor values by editor ID, comma-separated (e.g. "Strength, CarryWeight"). See `help <name> 4 avif`.
sExtraActorValues = 
; Active magic effects on actors: effect, source spell or item, caster, magnitude and time left.
bShowMagicEffects = 0
iMaxMagicEffects = 12
bShowBounds = 0
bShowGravity = 0
bShowGraphVariables = 0
; Comma-separated. bName = bool, iName = int, others float; force with name:b, name:i, name:f.
sGraphVariables = iState, bIsSitting, Speed, Direction, bInJumpState
bShowEngineDetails = 0
