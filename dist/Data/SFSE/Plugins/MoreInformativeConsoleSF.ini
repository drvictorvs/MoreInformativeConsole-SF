; More Informative Console SF
;
; If OSF Settings is installed, configure the mod in its menu instead: the menu's values replace
; the ones in this file. This file is used when OSF Settings isn't installed (and for fMargin).
; Changes here take effect the next time the game starts.

[General]
; Draw the info panel above the console.
bShowPanel = 1
; Also print the same information into the console history each time you click a new reference.
bPrintToConsole = 0
; How often, in frames, the panel re-reads the selection while the console is open.
iRefreshFrames = 15
; Write the raw selection text and panel layout numbers to the log (for troubleshooting).
bDebugLog = 0

[Panel]
; 1 = right edge of the console, 0 = left edge.
bAlignRight = 1
; Panel width as a percentage of the console width.
fWidthPercent = 40
; Scales the whole panel, text included (0.5 to 2.5 in the menu).
fScale = 1.0
; 0 = same size as the console text.
iFontSize = 0
; Gap between the panel and the console, in pixels.
fMargin = 8
; Extra nudge, in pixels (negative Y moves it up).
fOffsetX = 0
fOffsetY = 0
; Colors: 0xRRGGBB or #RRGGBB.
iBackgroundColor = 0x000000
; 0.0 (transparent) to 1.0 (opaque).
fBackgroundAlpha = 0.65
iLabelColor = 0x9FB4C8
iHeaderColor = 0xF2C14E

[Content]
bShowReference = 1
bShowBase = 1
bShowModel = 1
bShowKeywords = 1
iMaxKeywords = 12
; Race, traits (essential, protected, unique...), level.
bShowNPC = 1
bShowFactions = 1
; Lock level and key for doors and containers.
bShowLock = 1
bShowPosition = 1
; Parent locations, e.g. "Jemison Mercantile > New Atlantis > Jemison".
bShowLocationChain = 1
bShowInventory = 1
iMaxInventoryItems = 8
; AI package, queued idle, furniture, spoken line, follower command, light level.
bShowAI = 1

[Experimental]
; These call through the game's function tables, which can't be checked in advance.
; If turning one on crashes the game, turn it off and report it.
bShowActorState = 0
bShowActorValues = 0
bShowBounds = 0
bShowGravity = 0
bShowGraphVariables = 0
; Comma-separated. bName = bool, iName = int, others float; force with name:b, name:i, name:f.
sGraphVariables = iState, bIsSitting, Speed, Direction, bInJumpState
bShowEngineDetails = 0
